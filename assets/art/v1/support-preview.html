<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筹码、牌背与牌桌 v1</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#090712;color:#f4dfa0;font-family:"Microsoft YaHei",sans-serif}main{max-width:900px;margin:auto}h1{margin:0 0 5px}p{color:#aaa0bd;margin:0 0 22px}.decks{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.deck{aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;box-shadow:0 14px 35px #000a;border:2px solid #8d6d33;position:relative}.deck b{position:absolute;left:9px;top:9px;padding:4px 8px;border-radius:8px;background:#070610dc}.d1{background-image:url('decks/web/deck-tier-1-green-compass.webp')}.d2{background-image:url('decks/web/deck-tier-2-oxblood-compass.webp')}.d3{background-image:url('decks/web/deck-tier-3-navy-compass.webp')}.gems{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin:28px 0}.gem{aspect-ratio:1;border-radius:50%;background-size:119%;background-position:center;background-repeat:no-repeat;box-shadow:0 8px 20px #000b}.white{background-image:url('gems/web/gem-white.webp')}.blue{background-image:url('gems/web/gem-blue.webp')}.green{background-image:url('gems/web/gem-green.webp')}.red{background-image:url('gems/web/gem-red.webp')}.black{background-image:url('gems/web/gem-black.webp')}.gold{background-image:url('gems/web/gem-gold.webp')}.table{height:260px;border:2px solid #8d6d33;border-radius:28px;background:url('table/web/mobile-table-navy.webp') center/cover;box-shadow:inset 0 0 70px #000b}.note{margin-top:12px;font-size:13px;color:#8f879d}@media(max-width:620px){body{padding:12px}.decks{gap:8px}.deck{border-radius:9px}.gems{grid-template-columns:repeat(3,1fr);gap:12px}.table{height:190px}}
</style></head><body><main><h1>生产级辅助素材 v1</h1><p>三级独立牌背、六色机制优先筹码、轻量牌桌背景。</p><section class="decks"><div class="deck d1"><b>Ⅰ级</b></div><div class="deck d2"><b>Ⅱ级</b></div><div class="deck d3"><b>Ⅲ级</b></div></section><section class="gems"><div class="gem white"></div><div class="gem blue"></div><div class="gem green"></div><div class="gem red"></div><div class="gem black"></div><div class="gem gold"></div></section><section class="table"></section><div class="note">筹码文件尚无真实Alpha；此页与游戏相同，使用圆形裁切隐藏背景。</div></main></body></html>
