<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>发展卡母版 v1 总览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090712;color:#f3df9b;font-family:"Microsoft YaHei",sans-serif;padding:22px}h1{margin:0 0 5px;font-size:25px}p{margin:0 0 18px;color:#aaa0bd}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px;max-width:1050px;margin:auto}.card{position:relative;border:2px solid #80632d;border-radius:12px;overflow:hidden;background:#171224;box-shadow:0 9px 22px #0009;aspect-ratio:3/4}
    img{width:100%;height:100%;object-fit:cover;display:block}.tag{position:absolute;left:7px;top:7px;padding:3px 7px;border-radius:8px;background:#090712dc;color:#fff;font-weight:bold}.name{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 7px;background:linear-gradient(transparent,#080611 45%);font-size:12px;text-align:center}
    .white{border-color:#e4e0d4}.blue{border-color:#3e9cf3}.green{border-color:#4fbd66}.red{border-color:#e45a4e}.black{border-color:#7c8290}@media(max-width:760px){body{padding:10px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}h1{font-size:20px}.name{font-size:10px}}
  </style>
</head><body><h1>发展卡场景母版 v1 · 3等级 × 5奖励色</h1><p>384×512 WebP；数值、费用、奖励色和边框由游戏程序叠加。</p><main class="grid">
  <div class="card white"><img src="web/card-t1-white-limestone-quarry.webp"><b class="tag">Ⅰ·白</b><span class="name">石灰岩采石场</span></div>
  <div class="card blue"><img src="web/card-t1-blue-coastal-sorting.webp"><b class="tag">Ⅰ·蓝</b><span class="name">海岸分拣</span></div>
  <div class="card green"><img src="web/card-t1-green-river-quarry.webp"><b class="tag">Ⅰ·绿</b><span class="name">河岸采石</span></div>
  <div class="card red"><img src="web/card-t1-red-glass-kiln.webp"><b class="tag">Ⅰ·红</b><span class="name">玻璃小窑</span></div>
  <div class="card black"><img src="web/card-t1-black-onyx-mine.webp"><b class="tag">Ⅰ·黑</b><span class="name">玛瑙矿场</span></div>
  <div class="card white"><img src="web/card-t2-white-marble-guild.webp"><b class="tag">Ⅱ·白</b><span class="name">大理石行会</span></div>
  <div class="card blue"><img src="web/card-t2-blue-canal-trade.webp"><b class="tag">Ⅱ·蓝</b><span class="name">运河商贸城</span></div>
  <div class="card green"><img src="web/card-t2-green-waterwheel-quarter.webp"><b class="tag">Ⅱ·绿</b><span class="name">水轮加工街区</span></div>
  <div class="card red"><img src="web/card-t2-red-glass-guild.webp"><b class="tag">Ⅱ·红</b><span class="name">玻璃金匠行会</span></div>
  <div class="card black"><img src="web/card-t2-black-iron-canal.webp"><b class="tag">Ⅱ·黑</b><span class="name">铁器运河仓区</span></div>
  <div class="card white"><img src="web/card-t3-white-exchange-palace.webp"><b class="tag">Ⅲ·白</b><span class="name">大理石交易宫</span></div>
  <div class="card blue"><img src="web/card-t3-blue-maritime-guildhall.webp"><b class="tag">Ⅲ·蓝</b><span class="name">海贸商会</span></div>
  <div class="card green"><img src="web/card-t3-green-conservatory-palace.webp"><b class="tag">Ⅲ·绿</b><span class="name">温室花园宫</span></div>
  <div class="card red"><img src="web/card-t3-red-merchant-palace.webp"><b class="tag">Ⅲ·红</b><span class="name">商人宫殿</span></div>
  <div class="card black"><img src="web/card-t3-black-treasury-citadel.webp"><b class="tag">Ⅲ·黑</b><span class="name">金库城堡</span></div>
</main></body></html>
