<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贵族肖像 v1 总览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090712;color:#f3df9b;font-family:"Microsoft YaHei",sans-serif;padding:24px}
    h1{margin:0 0 6px;font-size:26px}p{margin:0 0 22px;color:#aaa0bd}.grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:16px;max-width:1100px;margin:auto}
    figure{margin:0;border:1px solid #84652e;border-radius:14px;padding:8px;background:linear-gradient(160deg,#261d39,#100d19);box-shadow:0 10px 25px #0008}
    img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:9px}figcaption{padding:9px 3px 3px;font-size:14px}.id{color:#7dd9ff;margin-right:6px}
    @media(max-width:760px){body{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}h1{font-size:21px}}
  </style>
</head>
<body>
  <h1>贵族肖像 v1 · 10人完整组</h1><p>320×400 WebP正式加载资源；姓名、分数和需求由游戏程序叠加。</p>
  <main class="grid">
    <figure><img src="web/noble-n1-alexandra.webp"><figcaption><span class="id">n1</span>亚历珊德拉女王</figcaption></figure>
    <figure><img src="web/noble-n2-saladin.webp"><figcaption><span class="id">n2</span>萨拉丁苏丹</figcaption></figure>
    <figure><img src="web/noble-n3-isabella.webp"><figcaption><span class="id">n3</span>伊莎贝拉王后</figcaption></figure>
    <figure><img src="web/noble-n4-margaret.webp"><figcaption><span class="id">n4</span>玛格丽特皇后</figcaption></figure>
    <figure><img src="web/noble-n5-catherine.webp"><figcaption><span class="id">n5</span>凯瑟琳女伯爵</figcaption></figure>
    <figure><img src="web/noble-n6-casimir.webp"><figcaption><span class="id">n6</span>卡西米尔公爵</figcaption></figure>
    <figure><img src="web/noble-n7-frederick.webp"><figcaption><span class="id">n7</span>弗雷德里克公爵</figcaption></figure>
    <figure><img src="web/noble-n8-james.webp"><figcaption><span class="id">n8</span>詹姆斯国王</figcaption></figure>
    <figure><img src="web/noble-n9-sophia.webp"><figcaption><span class="id">n9</span>索菲亚大公</figcaption></figure>
    <figure><img src="web/noble-n10-maria.webp"><figcaption><span class="id">n10</span>玛利亚公爵夫人</figcaption></figure>
  </main>
</body>
</html>
